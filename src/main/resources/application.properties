spring.profiles.active=dev

server.port=8081

docs.v2.base-url=https://docs.jmix.io/2.x/jmix/2.8
docs.v3.base-url=https://docs.jmix.io/jmix
docs.initial-page=intro.html
docs.limit=0

uisamples.v2.base-url=https://demo.jmix.io/ui-samples-v2
uisamples.v3.base-url=https://demo.jmix.io/ui-samples
uisamples.doc-path=doc
uisamples.sample-path=sample
uisamples.limit=0

javaapi.v2.base-url=https://docs.jmix.io/api/2.8
javaapi.v3.base-url=https://docs.jmix.io/api/3.0
javaapi.class-list-page=allclasses-index.html
javaapi.whitelist=core,data,flowui,security,securityflowui,rest
# internal packages excluded from the Java API corpus (path substrings)
javaapi.blacklist=/impl/,/antlr2/
javaapi.limit=0
javaapi.enrichment.model=gpt-5.4-nano
javaapi.enrichment.reasoning-effort=low
javaapi.enrichment.parallelism=8

snippets.enrichment.model=gpt-5.4-nano
snippets.enrichment.reasoning-effort=low
snippets.enrichment.parallelism=24
enrichment.openai.connect-timeout=10s
enrichment.openai.read-timeout=5m

trainings.local-path=.jmix/work/jmix-flowui-trainings
trainings.limit=0
trainings.whitelist=01 Basic courses,02 Advanced courses,03 Additional courses
trainings.blacklist=jmix-introduction_EN.adoc

answer-checks.model=gpt-5-mini
answer-checks.temperature=1
answer-checks.parallelism=4
# a check counts as "passed" (correct) when its score is at least this; drives the accuracy metric
answer-checks.pass-threshold=0.8

# substituted into the ${jmixVersion} placeholder of the systemMessage per requested version
system-prompt.v2=version 2.8
system-prompt.v3=version 3.0

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

chat.api.max-request-length=50000

# Shared key that internal clients (the MCP server, the website chat) must send in the X-API-Key
# header on /chat, /chat/stream and /api/**. Switch api.auth.enabled on only after every client
# sends the header - they can start sending it while the check is still off. Starting with the
# check on and no key set fails on purpose.
api.auth.enabled=false
api.auth.key=${JMIX_AI_API_KEY:}

# The only actuator endpoints that exist over HTTP. Do NOT widen this to "*".
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/health stays anonymous so container probes can read it; its component details
# (datasource state, disk paths) are therefore shown only to an authenticated user
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.otlp.logging.endpoint=http://localhost:4318/v1/logs

main.datasource.url=jdbc:postgresql://localhost/jmix-ai-backend
main.datasource.username=root
main.datasource.password=root

main.liquibase.change-log=io/jmix/ai/backend/liquibase/changelog.xml
pgvector.liquibase.change-log=io/jmix/ai/backend/liquibase/pgvector/changelog.xml

main.datasource.studio.liquibase.exclude-prefixes=spring_ai_

jmix.core.additional-stores=pgvector

pgvector.datasource.url=jdbc:postgresql://localhost:5433/postgres
pgvector.datasource.username=postgres
pgvector.datasource.password=postgres

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=io/jmix/ai/backend/menu.xml
jmix.ui.composite-menu=false

jmix.core.available-locales=en

vaadin.launch-browser=false

# RFC 9457 ProblemDetail bodies for MVC exceptions: the reason of a
# ResponseStatusException (e.g. /api/v2/search validation) reaches API clients
# in the "detail" field. Messages of unexpected 500s are NOT exposed.
spring.mvc.problemdetails.enabled=true
