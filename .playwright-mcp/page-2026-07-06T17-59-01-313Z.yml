                - generic [ref=f24e222]: 019f380e-c0f1-7512-b9cc-c43bd327c426
              - gridcell [ref=f24e862]:
                - generic [ref=f24e224]: "Path: Add-ons Jmix not only provides a platform to build your applications. It also contains an ecosystem of add-ons that enrich the core functionality. Many add-ons are provided by the Jmix team, while others are contributions from the community. Jmix add-ons are published on the Jmix marketplace. You can browse and install them directly in Studio as described below. The Creating Add-ons section describes how to create your own add-ons to modularize your applications and reuse functionality. To publish your open-source add-on to the Jmix marketplace, see Publishing an Add-on. Installation Follow the instructions below to install add-ons into your project automatically. If you want to install an add-on manually by editing build scripts, see the documentation of the particular add-on. Launch Jmix Studio and switch to Jmix tool window. Expand the Settings menu from the toolbar and select Marketplace. Find the add-on and click Install. In order to install a commercial add-on, you need an active Enterprise subscription. If you don’t have a subscription, see the Enterprise Trial section for how to get a trial version. Click Apply & Close. The add-on will be installed into your project."
              - 'gridcell "{\"url\": \"https://docs.jmix.io/2.x/jmix/2.8/add-ons.html\", \"size\": 1200, \"type\": \"docs\", \"source\": \"add-ons.html\", \"docPath\": \"Add-ons\", \"updated\": \"2026-07-06T18:31:09.6658\", \"sourceHash\": \"5f5ff367\", \"jmixVersion\": \"v2\"}" [ref=f24e863]':
                - generic [ref=f24e226]: "{\"url\": \"https://docs.jmix.io/2.x/jmix/2.8/add-ons.html\", \"size\": 1200, \"type\": \"docs\", \"source\": \"add-ons.html\", \"docPath\": \"Add-ons\", \"updated\": \"2026-07-06T18:31:09.6658\", \"sourceHash\": \"5f5ff367\", \"jmixVersion\": \"v2\"}"
            - row [ref=f24e864]:
              - gridcell "019f3813-252d-77b6-b97c-229c577c57c7" [ref=f24e865]:
                - generic [ref=f24e229]: 019f3813-252d-77b6-b97c-229c577c57c7
              - gridcell [ref=f24e866]:
                - generic [ref=f24e231]: "Path: Add-ons > AI Tools > Getting Started This section shows how to enable the assistant in an application: add the dependencies, connect a model, grant access, and ask the first question. Prerequisites Before you continue, install the add-on as described in Installation. Connecting a Model The add-on communicates with the LLM through a Spring AI ChatClient, which requires a configured model provider. Choose one of the Spring AI model starters and add it to your build.gradle. For example, for OpenAI: implementation 'org.springframework.ai:spring-ai-starter-model-openai' Then specify the provider settings in application.properties. These are standard Spring AI properties, not properties defined by this add-on: spring.ai.openai.api-key=${OPENAI_API_KEY} spring.ai.openai.chat.options.model=gpt-4o-mini Keep secrets such as the API key out of application.properties. Pass them through an environment variable or another externalized configuration source, as shown above. If no model is configured, the application still starts and the chat UI still renders, but the assistant cannot answer. The composer is disabled, and the user sees a notification. This lets you add the UI before the model configured. Granting Access Access to the chat is controlled by the aitools-chat-user resource role. Assign it to the users who should be able to use the assistant. See Security Role for details. Asking the First Question After you restart the application, a new Chats item appears under the AI section in the main menu. Open the chat and submit a request in natural language, for example \"How many active users are there?\". You can configure which data the assistant can access and how much data it includes in responses. See Tools and Application Properties for details."
              - 'gridcell "{\"url\": \"https://docs.jmix.io/jmix/ai-tools/getting-started.html\", \"size\": 1774, \"type\": \"docs\", \"source\": \"ai-tools/getting-started.html\", \"docPath\": \"Add-ons > AI Tools > Getting Started\", \"updated\": \"2026-07-06T18:35:55.276743\", \"sourceHash\": \"f7e157d7\", \"jmixVersion\": \"v3\"}" [ref=f24e867]':
                - generic [ref=f24e233]: "{\"url\": \"https://docs.jmix.io/jmix/ai-tools/getting-started.html\", \"size\": 1774, \"type\": \"docs\", \"source\": \"ai-tools/getting-started.html\", \"docPath\": \"Add-ons > AI Tools > Getting Started\", \"updated\": \"2026-07-06T18:35:55.276743\", \"sourceHash\": \"f7e157d7\", \"jmixVersion\": \"v3\"}"
            - row [ref=f24e868]:
              - gridcell "019f3813-252d-77b6-b97b-d18846f57451" [ref=f24e869]:
                - generic [ref=f24e236]: 019f3813-252d-77b6-b97b-d18846f57451
              - gridcell [ref=f24e870]:
                - generic [ref=f24e238]: "Path: Add-ons > AI Tools The AI Tools add-on brings a Large Language Model (LLM)-powered assistant to your Jmix application. Out of the box, it provides a ready-to-use chat UI where users ask questions in natural language and the assistant answers them by calling tools. The add-on includes predefined tools tailored to Jmix applications and lets you add your own. The add-on is built on top of Spring AI. It does not bundle a specific model provider. Instead, you choose and configure a Spring AI model such as OpenAI, Anthropic, Azure OpenAI, or Ollama, and the add-on uses it through the standard Spring AI ChatClient. Overview The add-on offers three groups of functionality: Predefined tools. The add-on includes ready-made tools that the assistant can call. The current group, Data Load tools, lets the assistant inspect the available entities and their attributes, then generate, validate, and run a read-only JPQL query to load the requested data. See Tools. Extensible tool registry. Any Spring bean can contribute its own tools, and you can override the predefined ones. The AiToolRegistry collects all application tools. See Custom Tools and the Registry. Chat UI. Ready-made views and reusable fragments let you embed a complete chat experience into your application, including a chat hub with conversation history and a single-conversation view. Chat history is persisted. See User Interface. In addition, you can use the assistant programmatically from your own beans without the UI. Add-on Structure The add-on is split into layers, so you can include only what you need: Starter Description jmix-aitools-starter Core layer: the tool registry, predefined tools, and the programmatic assistant API. It has no UI and no persistence. jmix-aitools-flowui-starter Flow UI layer: chat views, fragments, and the security role. By itself, it provides the UI shell but leaves the chat services as no-op stubs. jmix-aitools-flowui-data-starter Persistence layer: stores conversations and messages in the database and provides working implementations of the chat services. The starters build on each other: jmix-aitools-flowui-data-starter → jmix-aitools-flowui-starter → jmix-aitools-starter. Installation For automatic installation through Jmix Marketplace, follow the instructions in Add-ons. For manual installation, add the following dependencies to your build.gradle: implementation 'io.jmix.aitools:jmix-aitools-starter' implementation 'io.jmix.aitools:jmix-aitools-flowui-starter' implementation 'io.jmix.aitools:jmix-aitools-flowui-data-starter' The add-on also requires a configured Spring AI model. See Getting Started for the complete setup. Important Note for Single Menu Mode Applications If your application uses Single menu mode, you should manually add menu items after installing an add-on. Open Menu Designer in Jmix Studio. Navigate to the Structure tab. Available menu items are displayed in the left panel. To add items: Select the desired items and click the > (Add Selected) button. Or, drag-and-drop them from the left panel into the current menu structure on the right. This step is required because applications in Single menu mode do not automatically merge add-on menus with the existing structure."
              - 'gridcell "{\"url\": \"https://docs.jmix.io/jmix/ai-tools/index.html\", \"size\": 3232, \"type\": \"docs\", \"source\": \"ai-tools/index.html\", \"docPath\": \"Add-ons > AI Tools\", \"updated\": \"2026-07-06T18:35:55.028057\", \"sourceHash\": \"d6c1627f\", \"jmixVersion\": \"v3\"}" [ref=f24e871]':
                - generic [ref=f24e240]: "{\"url\": \"https://docs.jmix.io/jmix/ai-tools/index.html\", \"size\": 3232, \"type\": \"docs\", \"source\": \"ai-tools/index.html\", \"docPath\": \"Add-ons > AI Tools\", \"updated\": \"2026-07-06T18:35:55.028057\", \"sourceHash\": \"d6c1627f\", \"jmixVersion\": \"v3\"}"
            - row [ref=f24e872]:
              - gridcell "019f3813-252f-7a2a-88e6-e88c851f298c" [ref=f24e873]:
                - generic [ref=f24e243]: 019f3813-252f-7a2a-88e6-e88c851f298c
              - gridcell [ref=f24e874]:
                - generic [ref=f24e245]: "Path: Add-ons > AI Tools > Programmatic API You can also use the assistant from your own code, without the chat UI. This is useful for background processing, custom views, or integration with existing business logic. AiAssistantService io.jmix.aitools.service.AiAssistantService is the main programmatic entry point. It is stateless, does not persist chat history, and exposes every registered tool to the model. Inject it and send a message: @Component public class SupportAssistant { @Autowired private AiAssistantService aiAssistantService; @Nullable public String ask(String question) { return aiAssistantService.send(question); (1) } } 1 send blocks until the full reply is produced and returns it. For incremental output, use stream(String), which returns a reactor.core.publisher.Flux<String> that emits the reply in chunks. AiDataLoadService io.jmix.aitools.dataload.AiDataLoadService is a specialized entry point for data loading. In addition to the conversational send and stream methods, it provides: loadData(String userText) – generates a JPQL query for the request, runs it, and returns a structured EntityDataLoadResult. EntityDataLoadResult exposes the full outcome of the load through the following fields: query — the LLM-generated query, before any repair; validationResult — the validation outcome; rows — the fetched rows, each a Map keyed by result-property name; hasMore — whether more rows are available beyond the returned page; executed — whether the query actually ran; executionError — the error message when it did not. Use this service when you need the data itself rather than a natural-language answer. Customizing the System Prompt The system prompt used by AiAssistantService is supplied by the AiAssistantSystemPromptProvider bean. The default implementation loads a bundled template that introduces the assistant and the tool usage rules. To use your own prompt, register a bean that implements AiAssistantSystemPromptProvider and returns your template. The default AiAssistantSystemPromptProvider is registered only if the application does not already define a bean of that type. If you provide your own implementation, it automatically takes precedence."
              - 'gridcell "{\"url\": \"https://docs.jmix.io/jmix/ai-tools/programmatic-api.html\", \"size\": 2222, \"type\": \"docs\", \"source\": \"ai-tools/programmatic-api.html\", \"docPath\": \"Add-ons > AI Tools > Programmatic API\", \"updated\": \"2026-07-06T18:35:56.039884\", \"sourceHash\": \"09852a40\", \"jmixVersion\": \"v3\"}" [ref=f24e875]':
