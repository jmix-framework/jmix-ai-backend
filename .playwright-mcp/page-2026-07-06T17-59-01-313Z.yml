                - generic [ref=f24e343]: "Path: Add-ons > Audit The Audit add-on provides the Entity Log functionality for tracking changes in your JPA entities. Installation For automatic installation through Jmix Marketplace, follow instructions in the Add-ons section. For manual installation, add the following dependencies to your build.gradle: implementation 'io.jmix.audit:jmix-audit-starter' implementation 'io.jmix.audit:jmix-audit-flowui-starter' Important Note for Single Menu Mode Applications If your application uses Single menu mode, you should manually add menu items after installing an add-on. Open Menu Designer in Jmix Studio. Navigate to the Structure tab. Available menu items are displayed in the left panel. To add items: Select the desired items and click the > (Add Selected) button. Or, drag-and-drop them from the left panel into the current menu structure on the right. This step is required because applications in Single menu mode do not automatically merge add-on menus with the existing structure."
