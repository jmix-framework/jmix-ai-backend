            - gridcell [ref=f18e1017]:
              - generic [ref=f18e290]: "Path: BPM > Using BPMN 2.0 > BPMN 2.0 Elements > Events > None Events None events are unspecified events, also called \"blank\" events. None Start Event A none start event technically means that the trigger for starting the process instance is unspecified. Graphical Notation A none start event is a circle with no inner icon. In other words, with no trigger type. Properties None start event has two specific properties: Form — defines a user interface when the process is to be started manually. See the Process Forms section for details. Process variables — provide information about parameters that are used for starting the process via API. XML Representation The XML representation of a none start event is the normal start event declaration without any sub-element (other start event types all have a sub-element declaring the type). <startEvent id=\"startEvent1\" name=\"Start\"> (1) <extensionElements> <jmix:processVariables> <jmix:processVariable name=\"invoiceId\" type=\"string\" /> (2) </jmix:processVariables> <jmix:formData type=\"no-form\" /> (3) </extensionElements> <outgoing>Flow_0h77bcd</outgoing> </startEvent> 1 — Start event definition. 2 — Process variable. 3 — Here may be a form definition. Multiple Start Events Although BPMN allows multiple start events, the process technically may have only one none start event. Otherwise, it will cause error at deployment. Don’t use more than one none start event like in the picture below: However, it is possible to use multiple start events of other types: You can use several message (or signal) start events provided the messages (or signals) differ. Start Events of Event Subprocesses Event subprocesses can have interrupting or non-interrupting start events. Interrupting — when event subprocess ends, the main process to be terminated. Non-interrupting — event subprocess executes in parallel and comes to its end, the main process continues. In the picture above, the first subprocess interrupts the main process when time is over. The second subprocess executes a service task and ends not affecting the main process. Triggering None Start Event via API The none start event is used when the process instance is started through the API by calling one of the startProcessInstanceByXXX methods. For example, ProcessInstance processInstance = runtimeService .startProcessInstanceByKey(\"process-id\"); Flowable API uses the term 'process definition key' that is equivalent to 'process id' in Jmix Studio. See details in the Flowable API section. Intermediate None Event Intermediate none events can be used to indicate some state achieved in the process. The engine itself doesn’t do anything in the event, it just passes through it. Graphical Notation An intermediate none event is visualized as a circle with a double outline and no inner icon (in other words, no trigger type). Properties Intermediate none event has no specific properties. XML Representation The XML representation of an intermediate none event is the event declaration by intermediateThrowEvent without any sub-element. <intermediateThrowEvent id=\"IntermediateEvent\" /> Example Intermediate none events are especially useful for monitoring to understand how the process is doing, for example, as milestones or key performance indicators (KPIs). None End Event A none end event is a type of end event that signifies the completion of a process without any specific outcome or result. It does not trigger any subsequent activities or flows in the process. Graphical Notation None end event is visualized as a circle with a thick outline and no inner icon. Properties None end event has no specific properties. XML Representation <endEvent id=\"end-event\" name=\"End\"> <incoming>Flow_0qwib28</incoming> </endEvent> Multiple End Events Formally, end event isn’t mandatory. The process ends when there are no activities to execute. But it is a good practice to finish each path of the process by the end event. Don’t try to bring all flows to the single end event – it only makes your diagram messy. Multiple end events allow to analyze how processes ended."
