              - generic [ref=f18e260]: 019cd86d-5f78-73df-83ae-ddaabd59c14a
            - gridcell [ref=f18e1001]:
              - generic [ref=f18e262]: "Path: BPM > Using BPMN 2.0 > BPMN 2.0 Elements > Tasks > Business Rule Task Overview A Business Rule Task is a task that evaluates a DMN table when it is reached in the process flow. See Using DMN 1.3 chapter for creating and managing DMN tables. Graphical Notation A business rule task is visualized as a rounded rectangle with a small table icon in the top-left corner. XML Representation Technically, a business rule task is a service task of special type: <serviceTask id=\"business-rule-task\" name=\"Business Rule Task\" flowable:type=\"dmn\"> (1) <extensionElements> <flowable:field name=\"decisionTableReferenceKey\"> (2) <flowable:string>decision-example</flowable:string> </flowable:field> </extensionElements> </serviceTask> 1 — Defines task type. 2 — Refers to the decision table. Properties A business rule task has the following properties: The key property is the Decision table key. You can select an existing DMN table from the dropdown list. To deploy the process, every business rules task must have a decision table."
            - gridcell [ref=f18e1002]:
