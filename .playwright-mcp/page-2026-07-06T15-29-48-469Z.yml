            - gridcell [ref=f18e1021]:
              - generic [ref=f18e297]: "Path: BPM > Using BPMN 2.0 > BPMN 2.0 Elements > Events > Timer Events Timer events in BPMN are events that are triggered based on a predefined time or duration. Timer events can be used to control the flow of a process by specifying when certain activities should be executed. Timers can also serve as boundary events, either interrupting or non-interrupting. Timer Start Event Timer start event is used to create process instances at a given time. It can be used for processes that should start only once or in specific time intervals. Embedded subprocess cannot have a timer start event, but event subprocess can. Graphical Notation A timer start event is visualized as a circle with clock inner icon. Properties Timer start event has the Timer properties that define its type and expression. See timer types for details. XML Representation The XML representation of a timer start event is the normal start event declaration, with the timer definition sub-element. <startEvent id=\"theStart\"> <timerEventDefinition> (1) . . . (2) </timerEventDefinition> </startEvent> 1 Timer event definition. 2 Definition child element. Using Timer Start Event In this example, the main process starts by timer event. And it has two event subprocesses also starting by timers. The first one is non-interruptible, it can do some activities at a certain moment from the process start. The second event subprocess has an interruptible timer, that means the main process will be stopped when this timer event fires. Don’t use initiator variable in a process with timer start event, it causes execution error. Unless you define and set its value programmatically. Timer Intermediate Event A timer intermediate event pauses process execution. When the execution reaches this event, a timer begins. Once the timer expires, the process resumes. Timer intermediate event is a waiting state. Graphical Notation A timer intermediate event is visualized as an intermediate catching event, with the timer icon on the inside. Properties Timer intermediate event has the Timer properties that define its type and expression. See timer types for details. XML Representation A timer intermediate event is defined as an intermediate catching event. The specific type sub-element is, in this case, a timerEventDefinition element. <intermediateCatchEvent id=\"timer\"> <timerEventDefinition> <timeDuration>PT8H</timeDuration> (1) </timerEventDefinition> </intermediateCatchEvent> 1 Timer type, for example, duration. Timer Types There are three timer types: Duration – triggers after the specified time period. Cycle – event repeats a certain number of times or according to Cron expression. Date – fires at specified date; ignored if date is in the past. For start timer event duration counts from the moment the process was deployed to server. Setting Time There are two ways to set the time parameter in timers: using a string in ISO 8601 format or a Cron expression. ISO 8601 ISO 8601 is an international standard fpr dates, times and time intervals. For example: 2035-06-17T07:42:14 – a date representing the year 2035, June 17, at 07 hours, 42 minutes, and 14 seconds. 2050:01:01 – a date representing the year 2050, January 1, at 00 hours and 00 minutes. PT30D – a duration of thirty days. PT10M – a duration of ten minutes. P3Y6M4DT12H30M5S – a duration of three years, six months, four days, twelve hours, thirty minutes, and five seconds. R3PT10H – a cyclic period recurring three times every ten hours. Don’t use very short periods of time, smaller than 3 seconds. BPM isn’t a real-time system. Cron Expressions Cron is a time-based job scheduling system used in Unix-like operating systems. It allows users to schedule tasks or commands to run at specific times, dates, or intervals. The term \"cron\" comes from the word \"chronos,\" which means time in Greek. You can specify time cycle using cron expressions; the example below shows trigger firing every 5 minutes, starting at full hour: 0 0/5 * * * ? In Timer intermediate event Cron expressions can be used ONLY with a Cyclic timer type. Otherwise, it’d be an error when you try to deploy the process."
