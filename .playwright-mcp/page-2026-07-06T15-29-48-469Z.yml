              - generic [ref=f18e304]: "Path: BPM > Using BPMN 2.0 > BPMN 2.0 Elements > Events > Cancel Events Cancel events are used in transaction subprocesses only. They are not available in the palette until you are in a transaction subprocess. There are two types of cancel events: Cancel end event Cancel boundary event Cancel End Event The cancel end event can only be used in combination with a BPMN transaction subprocess. When the cancel end event is reached, a cancel event is thrown which must be caught by a cancel boundary event. The cancel boundary event then cancels the transaction and triggers compensation. Graphical Notation A cancel end event is visualized as a typical end event (circle with thick outline), with the cancel icon inside. The cancel icon is completely black, to indicate its throwing semantics. XML Representation A cancel end event is represented as an end event, with a cancelEventDefinition child element. <endEvent id=\"myCancelEndEvent\"> <cancelEventDefinition /> </endEvent> Cancel Boundary Event An attached intermediate catching cancel event on the boundary of a transaction subprocess, or boundary cancel event for short, is triggered when a transaction is canceled. When the cancel boundary event is triggered, it first interrupts all active executions in the current scope. Next, it starts compensation for all active compensation boundary events in the scope of the transaction. Compensation is performed synchronously; in other words, the boundary event waits before compensation is completed before leaving the transaction. When compensation is completed, the transaction subprocess is left using any sequence flows running out of the cancel boundary event. Only a single cancel boundary event is allowed for a transaction subprocess. If the transaction subprocess hosts nested subprocesses, compensation is only triggered for subprocesses that have completed successfully. If a cancel boundary event is placed on a transaction subprocess with multi instance characteristics, if one instance triggers cancellation, the boundary event cancels all instances. Graphical Notation A cancel boundary event is visualized as a typical intermediate event (circle with a double outline) on the boundary, with the cancel icon inside. The cancel icon is unfilled to indicate its catching semantics. XML Representation A cancel boundary event is defined as a typical boundary event: <boundaryEvent id=\"boundary\" attachedToRef=\"transaction\" > <cancelEventDefinition /> </boundaryEvent> As the cancel boundary event is always interrupting the cancelActivity attribute is not required."
