            - gridcell [ref=f18e1013]:
              - generic [ref=f18e283]: "Path: BPM > Using BPMN 2.0 > BPMN 2.0 Elements > Events > Event Subscriptions Event subscriptions is a mechanism that connect events as process elements to their specific occurrences. Essentially, when a process has an event subscription, it means that it is set up to react when such an event occurs. Event subscriptions can be created either during deployment or at runtime, depending on the event type: Start events – an event-based start event (message, timer, error, compensation, signal) creates an event subscription upon deployment of the process definition. When the corresponding event occurs, a new process instance starts. Intermediate events / boundary events – when the process execution arrives at one of these catching events, it pauses and creates a subscription. When the corresponding event occurs, (e.g., a message is received, or a timer expires), the process engine checks the list of active subscriptions for a matching entry. The execution resumes once the match is found. To help identify the correct process instance to initiate or the execution to resume, event subscriptions are configured with correlation parameters. All subscriptions and their parameters are stored in the ACT_RU_EVENT_SUBSCR database table. Event Subscriptions API Creating Event Subscriptions You can create event subscriptions programmatically. For example, you can start a process instance by sending a message: // Start a process instance with a message ProcessInstance processInstance = runtimeService.startProcessInstanceByMessage(\"orderPlaced\", processVariables); Querying Event Subscriptions You can query for existing event subscriptions to see which processes are waiting for specific events. For example: List<EventSubscription> messageSubscriptions = runtimeService.createEventSubscriptionQuery() .eventType(\"message\") .list(); Getting Event Subscriptions You can get a list of subscriptions using RuntimeService API. For example, signal subscriptions: // Query for all signal event subscriptions List<EventSubscription> signalSubscriptions = runtimeService.createEventSubscriptionQuery() .eventType(\"signal\") .list(); For other types of events, use \"message\", \"error\", and \"compensate\" respectively. For timers, use ManagementService: List<Job> timerJobs = managementService.createTimerJobQuery().list(); Triggering Event Subscriptions You can trigger event subscription when the corresponding event occurs. For example, to trigger a message event: runtimeService.messageEventReceived(\"orderPlaced\", executionId, processVariables); Deleting Event Subscriptions You can delete event subscriptions if they are no longer necessary. For example, to delete a specific event subscription: runtimeService.createEventSubscriptionQuery() .eventType(\"message\") .processInstanceId(processInstanceId) .singleResult(); Handling Events with Listeners See the Listeners section."
