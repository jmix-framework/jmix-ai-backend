            - gridcell [ref=f18e1029]:
              - generic [ref=f18e311]: "Path: BPM > Using BPMN 2.0 > BPMN 2.0 Elements > Events > Workarounds for Unsupported Events In this section, you’ll find recipes how to implement a desired process logic for elements that are not supported in Jmix BPM. Message Throwing Event First, use signals instead of messages everywhere it is possible. In most cases, these types of events are interchangeable. Second, use a service task with the API call. Service task can be implemented as Spring bean, for example: @Component(value = \"smpl_MyService\") public class MyService { @Autowired private RuntimeService runtimeService; public void sendMessage(String messageName, String executionId) { runtimeService.messageEventReceived(messageName, executionId); } } Signal Throwing End Event Use the combination of signal throwing intermediate event and none_end_event: Compensation End Event Escalation Events It is possible to use BPMN error events instead of escalation in certain scenarios. Error events in BPMN are used to handle unexpected errors or exceptions that occur during the execution of a process. They can be used to model error handling and recovery mechanisms within a process. Escalation events, on the other hand, are used to escalate a problem to a higher level in the organization or process hierarchy. They are typically used when a problem cannot be resolved at the current level and needs to be escalated for further action. So, escalation events are technically very close to error events. Conditional Events The conditional event defines an event which is triggered if a given condition is evaluated to true. It can be used as start event of an event subprocess, as intermediate event and boundary event. The start and boundary event can be interrupting and non interrupting. You can implement similar logic by using execution listeners in combination with signal or message event. Link Events Don’t use link events. Link events can appear on the diagram when importing the XML file from 3rd party tools like Camunda Modeler."
