                      - gridcell:
                        - generic: "TITLE: Class AbstractAction (io.jmix.flowui.kit.action) DESCRIPTION: Abstract base class for Flow UI actions. Use it when you need a reusable action implementation with built-in properties such as text, description, enabled, visible, shortcut combination, icon component, and variant, along with property change notifications. It works together with the Action interface and is designed to be extended by concrete actions such as BaseAction. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/kit/action/AbstractAction.html LANGUAGE: java CODE: ```java public abstract class AbstractAction extends Object implements Action // All Implemented Interfaces: Action, HasShortcutCombination // Direct Known Subclasses: BaseAction // Fields protected String description protected boolean enabled protected EventBus eventBus protected com.vaadin.flow.component.Component icon protected final String id protected KeyCombination shortcutCombination protected String text protected ActionVariant variant protected boolean visible // Constructors protected AbstractAction(String id) // Methods com.vaadin.flow.shared.Registration addPropertyChangeListener(Consumer<PropertyChangeEvent> listener) // Adds a listener to be notified about changes in the properties of the action. protected void firePropertyChange(String propertyName, Object oldValue, Object newValue) String getDescription() // Returns the description property value of an action. protected EventBus getEventBus() com.vaadin.flow.component.icon.Icon getIcon() // Deprecated, for removal: This API element is subject to removal in a future version. com.vaadin.flow.component.Component getIconComponent() // Returns the component that represents an icon associated with this action. String getId() KeyCombination getShortcutCombination() String getText() // Returns the text property value of an action. ActionVariant getVariant() // Returns the variant property value of an action. protected boolean hasListener(Class<? extends EventObject> eventType) boolean isEnabled() // Returns the enabled property value of an action. boolean isVisible() // Returns the visible property value of an action. void setDescription(String description) // Sets the description property value of an action. void setEnabled(boolean enabled) // Sets the enabled property value of an action. void setIcon(com.vaadin.flow.component.icon.Icon icon) // Deprecated, for removal: This API element is subject to removal in a future version. void setIconComponent(com.vaadin.flow.component.Component icon) // Sets the component that represents an icon associated with this action. void setShortcutCombination(KeyCombination shortcutCombination) // Sets object that stores information about keys, modifiers and additional settings that describe shortcut combinations. void setText(String text) // Sets the text property value of an action. void setVariant(ActionVariant variant) // Sets the variant property value of an action. void setVisible(boolean visible) // Sets the visible property value of an action. // Fields inherited from interface io.jmix.flowui.kit.action.Action: PROP_DESCRIPTION, PROP_ENABLED, PROP_ICON, PROP_SHORTCUT_COMBINATION, PROP_TEXT, PROP_VARIANT, PROP_VISIBLE // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Methods inherited from interface io.jmix.flowui.kit.action.Action: actionPerform, refreshState // Usage example: import io.jmix.flowui.kit.action.AbstractAction; import io.jmix.flowui.action.ActionVariant; public class SaveAction extends AbstractAction { public SaveAction() { super(\"save\"); setText(\"Save\"); setDescription(\"Save current changes\"); setVariant(ActionVariant.PRIMARY); setEnabled(true); setVisible(true); } @Override public void actionPerform() { // perform save } } ```"
