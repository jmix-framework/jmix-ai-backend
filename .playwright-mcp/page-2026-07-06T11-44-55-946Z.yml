                      - gridcell:
                        - generic: "TITLE: Class AbstractDataLoadCoordinator (io.jmix.flowui.facet.impl) DESCRIPTION: AbstractDataLoadCoordinator is the base implementation of DataLoadCoordinator used to set up automatic data loading in a Flow UI view or fragment. It analyzes loader query parameters, component IDs, and instance container names to create load triggers for visual component value changes, container item changes, and default view events. Jmix developers use it when they need coordinated loading for DataLoader instances driven by parameter prefixes such as componentPrefix and containerPrefix, or when they want to inspect the configured Trigger list. The class works together with ReflectionCacheManager, query parameter handling, and the owner data returned by getOwnerData() to discover components and unconfigured loaders. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/facet/impl/AbstractDataLoadCoordinator.html LANGUAGE: java CODE: ```java public abstract class AbstractDataLoadCoordinator extends AbstractFacet implements DataLoadCoordinator // All Implemented Interfaces: DataLoadCoordinator, Facet // Direct Known Subclasses: FragmentDataLoadCoordinatorImpl, ViewDataLoadCoordinatorImpl // Fields protected String componentPrefix protected String containerPrefix protected static final Pattern LIKE_PATTERN protected ReflectionCacheManager reflectionCacheManager protected List<DataLoadCoordinator.Trigger> triggers // Constructors AbstractDataLoadCoordinator(ReflectionCacheManager reflectionCacheManager, QueryParamValuesManager queryParamValuesManager) // Methods void addOnComponentValueChangedLoadTrigger(DataLoader loader, com.vaadin.flow.component.Component component, String param, DataLoadCoordinator.LikeClause likeClause) // Adds trigger on visual component ValueChangeEvent. void addOnContainerItemChangedLoadTrigger(DataLoader loader, InstanceContainer<?> container, String param) // Adds trigger on data container ItemChangeEvent. protected abstract void addOnDefaultEventLoadTrigger(DataLoader loader) void configureAutomatically() // Configures triggers automatically relying upon parameter prefixes. protected void configureAutomatically(DataLoader loader) protected boolean containsLikeClause(Condition condition, String parameter) protected boolean containsLikeClause(String query, String parameter) protected abstract com.vaadin.flow.component.Component findComponent(String componentId) protected DataLoadCoordinator.LikeClause findLikeClause(DataLoader loader, String parameter) protected String findSingleParam(DataLoader loader) protected List<String> getConditionParameters(DataLoader loader) protected abstract HasDataComponents getOwnerData() protected com.vaadin.flow.component.Composite<?> getOwnerNN() List<DataLoadCoordinator.Trigger> getTriggers() // Returns configured triggers. protected Stream<DataLoader> getUnconfiguredLoaders(HasDataComponents data) protected boolean loaderIsNotConfiguredYet(DataLoader loader) void setComponentPrefix(String value) // Sets parameter prefix to denote a visual component. void setContainerPrefix(String value) // Sets parameter prefix to denote a data container. // : DataLoadCoordinator.LikeClause, DataLoadCoordinator.Trigger // Fields inherited from class io.jmix.flowui.facet.impl.AbstractFacet: id, owner // Fields inherited from interface io.jmix.flowui.facet.DataLoadCoordinator: DEFAULT_COMPONENT_PREFIX, DEFAULT_CONTAINER_PREFIX, NAME // Methods inherited from class io.jmix.flowui.facet.impl.AbstractFacet: getId, getOwner, setId, setOwner // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Methods inherited from interface io.jmix.flowui.facet.DataLoadCoordinator: addOnViewEventLoadTrigger // Methods inherited from interface io.jmix.flowui.facet.Facet: getId, getOwner, setId, setOwner // Usage example: public class MyDataLoadCoordinator extends AbstractDataLoadCoordinator { public MyDataLoadCoordinator(ReflectionCacheManager reflectionCacheManager, QueryParamValuesManager queryParamValuesManager) { super(reflectionCacheManager, queryParamValuesManager); } @Override protected void addOnDefaultEventLoadTrigger(DataLoader loader) { // default trigger implementation } @Override protected com.vaadin.flow.component.Component findComponent(String componentId) { return null; } @Override protected HasDataComponents getOwnerData() { return null; } } ```"
