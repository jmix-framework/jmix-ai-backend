                      - gridcell:
                        - generic: "TITLE: Class AbstractComparator<T> (io.jmix.core.comparator) DESCRIPTION: AbstractComparator<T> is a base class for implementing custom Comparator<T> logic in Jmix when you need consistent ordering with built-in support for ascending or descending comparison and null handling. It is designed for subclasses such as EntityValuesComparator and works together with metadata and MetadataTools when comparing application values or entity-related data. Use it when you need a reusable comparator foundation rather than writing comparison logic from scratch. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/core/comparator/AbstractComparator.html LANGUAGE: java CODE: ```java public abstract class AbstractComparator<T> extends Object implements Comparator<T> // Type Parameters: T - the type of objects that this comparator can compare // All Implemented Interfaces: Comparator<T> // Direct Known Subclasses: EntityValuesComparator // Fields protected boolean asc protected Metadata metadata protected MetadataTools metadataTools protected int nullsLast // Constructors protected AbstractComparator(boolean asc) // Methods protected int __compare(Object o1, Object o2) protected int compareAsc(Object o1, Object o2) // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Methods inherited from interface java.util.Comparator: compare, equals, reversed, thenComparing, thenComparing, thenComparing, thenComparingDouble, thenComparingInt, thenComparingLong ```"
