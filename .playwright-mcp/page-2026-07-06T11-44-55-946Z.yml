                        - generic: 019f373b-ad4e-7206-95ae-38daf5154995
                      - gridcell:
                        - generic: "TITLE: Interface DataContext (io.jmix.flowui.model) DESCRIPTION: DataContext tracks changes in entities loaded into a UI and ensures that the same entity identifier is represented by a single object instance inside the context. Jmix developers use it to merge loaded objects, create tracked entities, mark entities as modified or removed, and save or clear changes before committing data. It can also be linked to a parent DataContext and customized with a save delegate when save behavior must be controlled outside the standard DataManager-based flow. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/model/DataContext.html LANGUAGE: java CODE: ```java @InstallSubject(\"saveDelegate\") public interface DataContext // All Known Subinterfaces: DataContextInternal // All Known Implementing Classes: DataContextImpl, NoopDataContext // Methods Subscription addChangeListener(Consumer<DataContext.ChangeEvent> listener) // Adds a listener to DataContext.ChangeEvent. Subscription addPostSaveListener(Consumer<DataContext.PostSaveEvent> listener) // Adds a listener to DataContext.PostSaveEvent. Subscription addPreSaveListener(Consumer<DataContext.PreSaveEvent> listener) // Adds a listener to DataContext.PreSaveEvent. void clear() // Evicts all tracked entities. default void clearChanges() // Clears the lists of modified and removed entities. boolean contains(Object entity) // Returns true if the context contains the given entity (distinguished by its class and id). <T> T create(Class<T> entityClass) // Creates an entity instance and merges it into the context. void evict(Object entity) // Removes the entity from the context so the context stops tracking it. void evictModified() // Clears the lists of created/modified/deleted entities and evicts these entities. <T> T find(Class<T> entityClass, Object entityId) // Returns an entity instance by its class and id. <T> T find(T entity) // Returns the instance of entity with the same id if it exists in this context. Set<Object> getModified() // Returns an immutable set of entities registered as modified. DataContext getParent() // Returns a parent context, if any. Set<Object> getRemoved() // Returns an immutable set of entities registered for removal. Function<SaveContext,Set<Object>> getSaveDelegate() // Returns a function which will be used to save data instead of standard implementation. boolean hasChanges() // Returns true if the context has detected changes in the tracked entities. boolean isModified(Object entity) // Returns true if the context has detected changes in the given entity. boolean isRemoved(Object entity) // Returns true if the context has registered removal of the given entity. EntitySet merge(Collection<?> entities) // Merge the given entities into the context. EntitySet merge(Collection<?> entities, MergeOptions options) // Merge the given entities into the context. <T> T merge(T entity) // Same as merge(Object, MergeOptions) with default options. <T> T merge(T entity, MergeOptions options) // Merge the given entity into the context. void remove(Object entity) // Removes the entity from the context and registers it as deleted. EntitySet save() // Saves changed and removed instances using DataManager or a custom save delegate. EntitySet save(boolean reloadSaved) // Saves changed and removed instances using DataManager, custom save delegate or merges them to parent data context if it is set. void setModified(Object entity, boolean modified) // Registers or unregisters the given entity as modified. void setParent(DataContext parentContext) // Sets the parent context. void setSaveDelegate(Function<SaveContext,Set<Object>> delegate) // Sets a function which will be used to save data instead of standard implementation. // Usage example: DataContext dataContext = null; Customer customer = dataContext.create(Customer.class); dataContext.setModified(customer, true); Customer managed = dataContext.find(customer); if (managed != null && dataContext.hasChanges()) { dataContext.save(); } ```"
                      - gridcell:
                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/flowui/model/DataContext.html\", \"size\": 4009, \"type\": \"javaapi\", \"source\": \"io/jmix/flowui/model/DataContext.html\", \"updated\": \"2026-07-06T14:39:12.040817\", \"enriched\": \"true\", \"className\": \"io.jmix.flowui.model.DataContext\", \"sourceHash\": \"33f4b092\", \"jmixVersion\": \"v2\"}"
                    - row:
                      - gridcell:
                        - generic: 019f373b-ad4e-7206-95b0-f1f195dd68a6
                      - gridcell:
                        - generic: "TITLE: Interface DataLoader (io.jmix.flowui.model) DESCRIPTION: Root interface for Flow UI data loaders that load entity instances and collections from DataManager or custom services into data containers. A Jmix developer uses it when configuring a loader that is connected to an InstanceContainer or CollectionContainer, especially to set the query, parameters, condition, hints, and DataContext before calling load(). It is also the common type for collection, instance, and key-value loaders, and provides optional monitoring info through a DataLoaderMonitoringInfo provider. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/model/DataLoader.html LANGUAGE: java CODE: ```java public interface DataLoader // All Known Subinterfaces: BaseCollectionLoader, CollectionLoader<E>, InstanceLoader<E>, KeyValueCollectionLoader, KeyValueInstanceLoader // All Known Implementing Classes: CollectionLoaderImpl, InstanceLoaderImpl, KeyValueCollectionLoaderImpl, KeyValueInstanceLoaderImpl // See Also: InstanceContainer CollectionContainer // Methods Condition getCondition() // Returns the root condition which is used together with the query when loading entities. InstanceContainer<?> getContainer() // Returns connected container. DataContext getDataContext() // Returns data context. Map<String,Serializable> getHints() default Function<DataLoader,DataLoaderMonitoringInfo> getMonitoringInfoProvider() // Returns function that provides monitoring info about this data loader. Object getParameter(String name) // Returns a query parameter by its name. Map<String,Object> getParameters() // Returns the map of query parameters. String getQuery() // Returns the query which is used for loading entities. void load() // Loads data to the connected container. void removeParameter(String name) // Removes a query parameter. void setCondition(Condition condition) // Sets the root condition which will be used together with the query when loading entities. void setDataContext(DataContext dataContext) // Sets the data context for the loader. void setHint(String hintName, Serializable value) // Sets custom hint that should be used by the query for loading data. default void setMonitoringInfoProvider(Function<DataLoader,DataLoaderMonitoringInfo> monitoringInfoProvider) // Sets function that provides monitoring info about this data loader. void setParameter(String name, Object value) // Sets a query parameter. void setParameters(Map<String,Object> parameters) // Sets the map of query parameters. void setQuery(String query) // Sets a query which will be used for loading entities. // Usage example: import io.jmix.flowui.model.DataLoader; import io.jmix.flowui.model.InstanceContainer; import java.util.Map; public class CustomerScreen { private DataLoader customerLoader; private InstanceContainer<?> customerDc; public void init() { customerLoader.setQuery(\"select e from Customer e where e.status = :status\"); customerLoader.setParameter(\"status\", \"ACTIVE\"); customerLoader.setCondition(null); customerLoader.setDataContext(null); customerLoader.setHint(\"fetchPlan\", \"customer-with-details\"); customerLoader.load(); } } ```"
                      - gridcell:
                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/flowui/model/DataLoader.html\", \"size\": 3194, \"type\": \"javaapi\", \"source\": \"io/jmix/flowui/model/DataLoader.html\", \"updated\": \"2026-07-06T14:39:12.266585\", \"enriched\": \"true\", \"className\": \"io.jmix.flowui.model.DataLoader\", \"sourceHash\": \"8d99113e\", \"jmixVersion\": \"v2\"}"
                    - row:
