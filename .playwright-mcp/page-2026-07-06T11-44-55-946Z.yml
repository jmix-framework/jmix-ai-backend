                      - gridcell:
                        - generic: "TITLE: Interface HasDataComponents (io.jmix.flowui.component) DESCRIPTION: Defines the data API access point for a view or fragment, exposing registered InstanceContainer and DataLoader instances together with an optional DataContext. Use it when you need to look up containers or loaders by id, register data components programmatically, or trigger loading of all DataLoader instances at once. It is implemented by ViewData and FragmentData, and the concrete runtime implementations are ViewDataImpl and FragmentDataImpl. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/component/HasDataComponents.html LANGUAGE: java CODE: ```java public interface HasDataComponents // All Known Subinterfaces: FragmentData, ViewData // All Known Implementing Classes: AbstractDataComponentsHolder, FragmentDataImpl, ViewDataImpl // Methods <T extends InstanceContainer<?>> T getContainer(String id) // Returns a container by its id. Set<String> getContainerIds() // Returns ids of all registered containers. DataContext getDataContext() // Returns view's DataContext. DataContext getDataContextOrNull() // Returns view's DataContext or null if it is not defined. <T extends DataLoader> T getLoader(String id) // Returns a loader by its id. Set<String> getLoaderIds() // Returns ids of all registered loaders. void loadAll() // Performs DataLoader.load() for all loaders registered in the view. void registerContainer(String id, InstanceContainer<?> container) // Registers the given container void registerLoader(String id, DataLoader loader) // Registers the given loader void setDataContext(DataContext dataContext) // Sets DataContext instance for the view. // Usage example: HasDataComponents data = null; // Register data components by id // data.registerContainer(\"customerDc\", customerContainer); // data.registerLoader(\"customersDl\", customersLoader); // Look them up later // InstanceContainer<?> container = data.getContainer(\"customerDc\"); // DataLoader loader = data.getLoader(\"customersDl\"); // Work with the data context and load all data // DataContext context = data.getDataContextOrNull(); // data.loadAll(); ```"
