                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/flowui/kit/action/Action.html\", \"size\": 5682, \"type\": \"javaapi\", \"source\": \"io/jmix/flowui/kit/action/Action.html\", \"updated\": \"2026-07-06T14:39:08.392809\", \"enriched\": \"true\", \"className\": \"io.jmix.flowui.kit.action.Action\", \"sourceHash\": \"f4b0ab62\", \"jmixVersion\": \"v2\"}"
                    - row:
                      - gridcell:
                        - generic: 019f373b-ad4e-7206-9597-1f78771142f9
                      - gridcell:
                        - generic: "TITLE: Class AbstractActionsHolderSupport<C extends com.vaadin.flow.component.Component> (io.jmix.flowui.kit.component.delegate) DESCRIPTION: AbstractActionsHolderSupport is a base class for managing Action instances attached to a Vaadin Component and keeping them bound to that component’s lifecycle. Use it when you need to add, remove, or look up actions by id, and when those actions may contribute keyboard shortcuts through ShortcutRegistration. Jmix components such as GridActionsSupport, ValuePickerActionSupport, and other action-support delegates extend this class to centralize action collection handling, attachment and detachment, and shortcut binding management. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/kit/component/delegate/AbstractActionsHolderSupport.html LANGUAGE: java CODE: ```java public abstract class AbstractActionsHolderSupport<C extends com.vaadin.flow.component.Component> extends Object // Type Parameters: C - the type of the component that holds actions // Direct Known Subclasses: FragmentActionsDelegate, GenericFilterActionsSupport, GridActionsSupport, JmixGroupGridActionsSupport, JmixKanbanActionsSupport, MainTabSheetActionsSupport, ValuePickerActionSupport // Fields protected List<Action> actions protected Map<Action,com.vaadin.flow.component.ShortcutRegistration> actionShortcutBinding protected final C component // Constructors AbstractActionsHolderSupport(C component) // Methods void addAction(Action action) // Adds an Action to the collection of actions at the default position. void addAction(Action action, int index) // Adds an Action to the collection of actions at the specified position. protected void addActionInternal(Action action, int index) protected void addShortcutListenerIfNeeded(Action action) protected void attachAction(Action action) protected void detachAction(Action action) Optional<Action> getAction(String id) // Finds an Action by its identifier. Collection<Action> getActions() // Returns a collection of all actions associated with this instance. protected Map<Action,com.vaadin.flow.component.ShortcutRegistration> getActionShortcutBinding() protected com.vaadin.flow.component.Component getShortcutLifecycleOwner() void removeAction(Action action) // Removes the specified Action from the collection of actions. protected boolean removeActionInternal(Action action) protected void removeShortcutListener(Action action) // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: ```java AbstractActionsHolderSupport<MyComponent> support = new AbstractActionsHolderSupport<MyComponent>(component) {}; Action saveAction = new Action(); support.addAction(saveAction); support.getAction(\"save\").ifPresent(action -> { support.removeAction(action); }); for (Action action : support.getActions()) { support.removeAction(action); } ``` ```"
                      - gridcell:
                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/flowui/kit/component/delegate/AbstractActionsHolderSupport.html\", \"size\": 2935, \"type\": \"javaapi\", \"source\": \"io/jmix/flowui/kit/component/delegate/AbstractActionsHolderSupport.html\", \"updated\": \"2026-07-06T14:39:08.631378\", \"enriched\": \"true\", \"className\": \"io.jmix.flowui.kit.component.delegate.com.vaadin.flow.component.Component>\", \"sourceHash\": \"3b9d54d8\", \"jmixVersion\": \"v2\"}"
                    - row:
