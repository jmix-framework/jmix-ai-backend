                      - gridcell:
                        - generic: "TITLE: Class AbstractBeanValidator.BeanValidationViolationCause (io.jmix.flowui.component.validation.bean) DESCRIPTION: Represents a bean validation failure cause wrapped for use in a composite validation exception. Jmix bean validation uses this type to carry a single jakarta.validation.ConstraintViolation from AbstractBeanValidator into CompositeValidationException.ViolationCause handling, so UI validation code can report the message for the violated constraint. Developers typically encounter it indirectly when working with bean validation and aggregated validation errors in Flow UI components. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/component/validation/bean/AbstractBeanValidator.BeanValidationViolationCause.html LANGUAGE: java CODE: ```java public static class AbstractBeanValidator.BeanValidationViolationCause extends Object implements CompositeValidationException.ViolationCause // All Implemented Interfaces: CompositeValidationException.ViolationCause, Serializable // Enclosing class: AbstractBeanValidator // See Also: Serialized Form // Fields protected jakarta.validation.ConstraintViolation constraintViolation // Constructors BeanValidationViolationCause(jakarta.validation.ConstraintViolation constraintViolation) // Methods String getMessage() // Returns a message. // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: import jakarta.validation.ConstraintViolation; AbstractBeanValidator.BeanValidationViolationCause cause = new AbstractBeanValidator.BeanValidationViolationCause(constraintViolation); String message = cause.getMessage(); ```"
