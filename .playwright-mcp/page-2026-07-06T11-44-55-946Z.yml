                      - gridcell:
                        - generic: "TITLE: Class AbstractComponentDelegate<C extends com.vaadin.flow.component.Component> (io.jmix.flowui.component.delegate) DESCRIPTION: Base delegate class for Jmix Flow UI component delegates that wraps a Vaadin Component instance. Use it when implementing or extending component-specific delegates such as AbstractDataViewDelegate, AbstractGridDelegate, AbstractGroupGridDelegate, AbstractValueComponentDelegate, or VirtualListDelegate and you need shared access to the underlying component. The delegate stores the component passed to its constructor and exposes it through getComponent(), making it useful for common component-related logic and behavior delegation. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/component/delegate/AbstractComponentDelegate.html LANGUAGE: java CODE: ```java public abstract class AbstractComponentDelegate<C extends com.vaadin.flow.component.Component> extends Object // Direct Known Subclasses: AbstractDataViewDelegate, AbstractGridDelegate, AbstractGroupGridDelegate, AbstractValueComponentDelegate, VirtualListDelegate // Fields protected C component // Constructors AbstractComponentDelegate(C component) // Methods C getComponent() // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: import com.vaadin.flow.component.Component; import io.jmix.flowui.component.delegate.AbstractComponentDelegate; public class MyComponentDelegate extends AbstractComponentDelegate<Component> { public MyComponentDelegate(Component component) { super(component); } public Component getWrappedComponent() { return getComponent(); } } ```"
                      - gridcell:
                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/flowui/component/delegate/AbstractComponentDelegate.html\", \"size\": 1711, \"type\": \"javaapi\", \"source\": \"io/jmix/flowui/component/delegate/AbstractComponentDelegate.html\", \"updated\": \"2026-07-06T14:39:10.84788\", \"enriched\": \"true\", \"className\": \"io.jmix.flowui.component.delegate.com.vaadin.flow.component.Component>\", \"sourceHash\": \"87f06955\", \"jmixVersion\": \"v2\"}"
