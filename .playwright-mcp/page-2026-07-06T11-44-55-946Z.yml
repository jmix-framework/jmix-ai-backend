                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/flowui/backgroundtask/BackgroundTask.html\", \"size\": 3734, \"type\": \"javaapi\", \"source\": \"io/jmix/flowui/backgroundtask/BackgroundTask.html\", \"updated\": \"2026-07-06T14:39:09.227848\", \"enriched\": \"true\", \"className\": \"io.jmix.flowui.backgroundtask.BackgroundTask\", \"sourceHash\": \"8cf52617\", \"jmixVersion\": \"v2\"}"
