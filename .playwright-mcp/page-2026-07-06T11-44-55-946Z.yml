                        - generic: "TITLE: Class AbstractClasspathScanner (io.jmix.core.impl.scanning) DESCRIPTION: Base class for classpath scanning in Jmix that turns a base package into a resource search and returns Spring MetadataReader instances for matching classes. Jmix developers typically use it when implementing custom scanning logic or extending the built-in JmixModulesClasspathScanner, where access to the Spring Environment, ResourceLoader, and MetadataReaderFactory is required. The DEFAULT_CLASS_RESOURCE_PATTERN constant and the resolveBasePackage and scanPackage methods are the key pieces for locating classes in a package on the application classpath. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/core/impl/scanning/AbstractClasspathScanner.html LANGUAGE: java CODE: ```java public abstract class AbstractClasspathScanner extends Object // Direct Known Subclasses: JmixModulesClasspathScanner // Fields static final String DEFAULT_CLASS_RESOURCE_PATTERN // Constructors AbstractClasspathScanner() // Methods protected abstract org.springframework.core.env.Environment getEnvironment() protected abstract org.springframework.core.type.classreading.MetadataReaderFactory getMetadataReaderFactory() protected abstract org.springframework.core.io.ResourceLoader getResourceLoader() protected String resolveBasePackage(String basePackage) protected Stream<org.springframework.core.type.classreading.MetadataReader> scanPackage(String packageName) // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: public class MyClasspathScanner extends AbstractClasspathScanner { @Override protected org.springframework.core.env.Environment getEnvironment() { return null; } @Override protected org.springframework.core.type.classreading.MetadataReaderFactory getMetadataReaderFactory() { return null; } @Override protected org.springframework.core.io.ResourceLoader getResourceLoader() { return null; } public void scan(String basePackage) { String packageName = resolveBasePackage(basePackage); scanPackage(packageName).forEach(metadataReader -> { }); } } ```"
                      - gridcell:
                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/core/impl/scanning/AbstractClasspathScanner.html\", \"size\": 2236, \"type\": \"javaapi\", \"source\": \"io/jmix/core/impl/scanning/AbstractClasspathScanner.html\", \"updated\": \"2026-07-06T14:39:10.060833\", \"enriched\": \"true\", \"className\": \"io.jmix.core.impl.scanning.AbstractClasspathScanner\", \"sourceHash\": \"bda16029\", \"jmixVersion\": \"v2\"}"
