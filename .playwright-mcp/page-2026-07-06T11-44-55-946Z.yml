                      - gridcell:
                        - generic: "TITLE: Class BackgroundTask<T,V> (io.jmix.flowui.backgroundtask) DESCRIPTION: BackgroundTask is an abstract unit of work executed by BackgroundWorker in the background, with a progress value type T and a result type V. Use it when you need a long-running task that can report progress, return a result, and react to completion, cancellation, exceptions, or timeouts. A task can be tied to a View so it is canceled automatically when the view is closed, and it can also be configured with a timeout using seconds or a custom TimeUnit. Override run(TaskLifeCycle) and optionally progress(List), done(V), canceled(), handleException(Exception), and handleTimeoutException() to implement the task behavior. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/backgroundtask/BackgroundTask.html LANGUAGE: java CODE: ```java public abstract class BackgroundTask<T,V> extends Object // Type Parameters: T - task progress measurement unit // Type Parameters: V - result type // Direct Known Subclasses: LocalizedTaskWrapper, MBeanOperationResultView.OperationBackgroundTask, NotificationsIndicator.ReloadCountTask, PreviewStormbpmnDiagramAction.ReloadStormbpmnDiagramTask, ResetPasswordView.ResetPasswordBackgroundTask, SaveStormbpmnDiagramAction.ReloadStormbpmnDiagramTask, SupersetDashboard.FetchGuestTokenTask, UploadProcessDraftAction.UploadProcessDraftsTask // Constructors protected BackgroundTask(long timeoutSeconds) // Creates a task with timeout in default TimeUnit.SECONDS unit. protected BackgroundTask(long timeoutSeconds, View<?> view) // Create a task with timeout in default TimeUnit.SECONDS unit. protected BackgroundTask(long timeout, TimeUnit timeUnit) // Creates a task with timeout. protected BackgroundTask(long timeout, TimeUnit timeUnit, View<?> view) // Creates a task with timeout. // Methods final void addProgressListener(BackgroundTask.ProgressListener<T,V> progressListener) // Add additional progress listener. void canceled() // Provides exclusive access to this UI from outside a request handling thread when the task is canceled by BackgroundTaskHandler.cancel() invocation. void done(V result) // Provides exclusive access to this UI from outside a request handling thread when the task is completed. final View<?> getOwnerView() Map<String,Object> getParams() // Called by the execution environment in UI thread to prepare some execution parameters. final List<BackgroundTask.ProgressListener<T,V>> getProgressListeners() // Additional progress listeners. final long getTimeoutMilliseconds() final long getTimeoutSeconds() boolean handleException(Exception ex) // Provides exclusive access to this UI from outside a request handling thread if the task run(TaskLifeCycle) method raised an exception. boolean handleTimeoutException() // Provides exclusive access to this UI from outside a request handling thread if the task timeout is exceeded. void progress(List<T> changes) // Provides exclusive access to this UI from outside a request handling thread on progress change. final void removeProgressListener(BackgroundTask.ProgressListener<T,V> progressListener) // Removes a progress listener. abstract V run(TaskLifeCycle<T> taskLifeCycle) // Main method that performs a task. // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: BackgroundTask<Integer, Void> task = new BackgroundTask<Integer, Void>(10, this) { @Override public Void run(TaskLifeCycle<Integer> taskLifeCycle) { taskLifeCycle.publish(1); taskLifeCycle.publish(2); return null; } @Override public void done(Void result) { // update UI after successful completion } }; ```"
