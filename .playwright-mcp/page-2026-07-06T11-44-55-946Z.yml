                      - gridcell:
                        - generic: "TITLE: Class AbstractBeanValidator (io.jmix.flowui.component.validation.bean) DESCRIPTION: Base bean validation helper for Flow UI that implements Validator and Consumer to check a value against Jakarta Bean Validation constraints of a specific bean property. Jmix developers typically use it when they need property-level validation with a custom validation error message or custom validation groups, especially as the superclass of BeanPropertyValidator. It works together with the bean class, bean property, Metadata, MessageTools, Messages, and a jakarta.validation.Validator to build the default error message and perform the actual validation. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/component/validation/bean/AbstractBeanValidator.html LANGUAGE: java CODE: ```java public class AbstractBeanValidator extends Object implements Validator // All Implemented Interfaces: Validator, Consumer // Direct Known Subclasses: BeanPropertyValidator // Fields protected Class beanClass protected String beanProperty protected Messages messages protected MessageTools messageTools protected Metadata metadata protected String validationErrorMessage protected Class[] validationGroups protected jakarta.validation.Validator validator // Constructors protected AbstractBeanValidator(Class beanClass, String beanProperty) protected AbstractBeanValidator(Class beanClass, String beanProperty, Class[] validationGroups) // Methods void accept(Object value) // Checks a value. String getDefaultErrorMessage() String getValidationErrorMessage() Class[] getValidationGroups() void setValidationErrorMessage(String validationErrorMessage) // Set main validation error message. void setValidationGroups(Class[] validationGroups) // Set custom validation groups. // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Methods inherited from interface java.util.function.Consumer: andThen // Usage example: // Typically used through a concrete subclass such as BeanPropertyValidator BeanPropertyValidator validator = new BeanPropertyValidator( Customer.class, \"email\", new Class[] { com.example.validation.StrictChecks.class } ); validator.setValidationErrorMessage(\"Email is invalid\"); validator.accept(\"wrong-email\"); String message = validator.getValidationErrorMessage(); ```"
