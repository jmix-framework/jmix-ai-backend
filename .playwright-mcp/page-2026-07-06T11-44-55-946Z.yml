                      - gridcell:
                        - generic: "TITLE: Class AbstractConfigurationDetail (io.jmix.flowui.component.genericfilter.configuration) DESCRIPTION: Base UI component for building the configuration save dialog used by the Generic Filter. Jmix developers extend this class when they need a custom configuration detail editor with fields for configuration ID, generated ID, and name, plus validation support through SupportsValidation. It is a Composite<FormLayout> that is initialized in initContent() and wired with Spring dependencies via ApplicationContextAware and afterPropertiesSet(). SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/component/genericfilter/configuration/AbstractConfigurationDetail.html LANGUAGE: java CODE: ```java public abstract class AbstractConfigurationDetail extends com.vaadin.flow.component.Composite<com.vaadin.flow.component.formlayout.FormLayout> implements org.springframework.context.ApplicationContextAware, org.springframework.beans.factory.InitializingBean, SupportsValidation // All Implemented Interfaces: com.vaadin.flow.component.AttachNotifier, com.vaadin.flow.component.DetachNotifier, com.vaadin.flow.component.HasElement, com.vaadin.flow.component.HasStyle, com.vaadin.flow.component.HasValidation, com.vaadin.flow.component.shared.HasValidationProperties, SupportsValidation, Serializable, org.springframework.beans.factory.Aware, org.springframework.beans.factory.InitializingBean, org.springframework.context.ApplicationContextAware // Direct Known Subclasses: FilterConfigurationDetail, UiDataFilterConfigurationDetail // See Also: Serialized Form // Fields protected org.springframework.context.ApplicationContext applicationContext protected static final String CONFIGURATION_ID_FIELD_ID protected TypedTextField<String> configurationIdField protected static final String GENERATED_ID_FIELD_ID protected JmixCheckbox generatedIdField protected Messages messages protected static final String NAME_FIELD_ID protected TypedTextField<String> nameField protected UiComponentProperties uiComponentProperties protected UiComponents uiComponents // Constructors AbstractConfigurationDetail() // Methods com.vaadin.flow.shared.Registration addValidator(Validator validator) // Adds a validator to the list of validators for the component. void afterPropertiesSet() protected void autowireDependencies() protected JmixCheckbox createCheckbox() protected void createConfigurationIdField() protected void createGeneratedIdField() protected void createNameField() protected TypedTextField<String> createTextField() void executeValidators() // Executes all registered validators against the current value of the component. protected void generatedIdFieldValueChangeListener(com.vaadin.flow.component.AbstractField.ComponentValueChangeEvent<com.vaadin.flow.component.checkbox.Checkbox,Boolean> event) protected com.vaadin.flow.component.formlayout.FormLayout initContent() protected abstract void initFields() boolean isInvalid() protected void nameFieldValueChangeListener(SupportsTypedValue.TypedValueChangeEvent<TypedTextField<String>,String> event) void setApplicationContext(org.springframework.context.ApplicationContext applicationContext) void setInvalid(boolean invalid) // Sets invalid state to the field considering result of field validation. // Fields inherited from interface io.jmix.flowui.component.SupportsValidation: PROPERTY_ERROR_MESSAGE // Methods inherited from class com.vaadin.flow.component.Composite: getChildren, getContent, getElement // Methods inherited from class com.vaadin.flow.component.Component: addListener, findAncestor, fireEvent, from, get, getEventBus, getId, getListeners, getLocale, getParent, getTranslation, getTranslation, getTranslation, getTranslation, getTranslation, getTranslation, getUI, hasListener, isAttached, isTemplateMapped, isVisible, onAttach, onDetach, onEnabledStateChanged, removeFromParent, scrollIntoView, scrollIntoView, set, setElement, setId, setVisible // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Methods inherited from interface com.vaadin.flow.component.AttachNotifier: addAttachListener // Methods inherited from interface com.vaadin.flow.component.DetachNotifier: addDetachListener // Methods inherited from interface com.vaadin.flow.component.HasElement: getElement // Methods inherited from interface com.vaadin.flow.component.HasStyle: addClassName, addClassNames, getClassName, getClassNames, getStyle, hasClassName, removeClassName, removeClassNames, setClassName, setClassName // Methods inherited from interface com.vaadin.flow.component.HasValidation: setManualValidation // Methods inherited from interface io.jmix.flowui.component.SupportsValidation: getErrorMessage, setErrorMessage // Usage example: import io.jmix.flowui.component.genericfilter.configuration.AbstractConfigurationDetail; public class MyConfigurationDetail extends AbstractConfigurationDetail { @Override protected void initFields() { createConfigurationIdField(); createGeneratedIdField(); createNameField(); } @Override protected com.vaadin.flow.component.formlayout.FormLayout initContent() { return super.initContent(); } } ```"
