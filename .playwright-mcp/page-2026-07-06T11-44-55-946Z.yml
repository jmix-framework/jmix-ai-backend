                      - gridcell:
                        - generic: "TITLE: Class AbstractConditionBuilder (io.jmix.flowui.component.genericfilter.builder) DESCRIPTION: Base implementation for GenericFilter condition builders. Use this abstract class when you need common behavior for creating filter conditions, especially HeaderFilterCondition instances based on metadata, and when implementing specialized builders such as ConfigurationConditionBuilder, PredefinedConditionBuilder, or PropertyConditionBuilder. It also participates in Spring ordering through Ordered, so concrete builders can be prioritized consistently. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/component/genericfilter/builder/AbstractConditionBuilder.html LANGUAGE: java CODE: ```java public abstract class AbstractConditionBuilder extends Object implements ConditionBuilder // All Implemented Interfaces: ConditionBuilder, org.springframework.core.Ordered // Direct Known Subclasses: ConfigurationConditionBuilder, PredefinedConditionBuilder, PropertyConditionBuilder // Fields protected final Metadata metadata // Constructors AbstractConditionBuilder(Metadata metadata) // Methods protected HeaderFilterCondition createHeaderFilterCondition(String label) // Fields inherited from interface org.springframework.core.Ordered: HIGHEST_PRECEDENCE, LOWEST_PRECEDENCE // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Methods inherited from interface io.jmix.flowui.component.genericfilter.builder.ConditionBuilder: build // Methods inherited from interface org.springframework.core.Ordered: getOrder // Usage example: import io.jmix.flowui.component.genericfilter.builder.AbstractConditionBuilder; import io.jmix.flowui.component.genericfilter.condition.HeaderFilterCondition; class MyConditionBuilder extends AbstractConditionBuilder { MyConditionBuilder(io.jmix.core.Metadata metadata) { super(metadata); } @Override public HeaderFilterCondition build() { return createHeaderFilterCondition(\"My filter\"); } } ```"
