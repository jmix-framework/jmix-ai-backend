                        - generic: "{\"url\": \"https://docs.jmix.io/api/2.8/io/jmix/flowui/component/factory/AbstractComponentGenerationStrategy.html\", \"size\": 4839, \"type\": \"javaapi\", \"source\": \"io/jmix/flowui/component/factory/AbstractComponentGenerationStrategy.html\", \"updated\": \"2026-07-06T14:39:10.97354\", \"enriched\": \"true\", \"className\": \"io.jmix.flowui.component.factory.AbstractComponentGenerationStrategy\", \"sourceHash\": \"e5ac5185\", \"jmixVersion\": \"v2\"}"
                    - row:
