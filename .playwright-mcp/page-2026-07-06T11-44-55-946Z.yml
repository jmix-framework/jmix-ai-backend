                        - generic: 019f373b-ad4e-7206-95ac-a49454f520c7
                      - gridcell:
                        - generic: "TITLE: Class AbstractDataComponentsHolder (io.jmix.flowui.model.impl) DESCRIPTION: Base implementation of HasDataComponents for managing a view or fragment’s data-related objects in Jmix Flow UI. Use AbstractDataComponentsHolder when you need to store and look up InstanceContainer and DataLoader instances by id, keep them associated with a DataContext, and trigger loadAll() to load every registered DataLoader. It is the common foundation for ViewDataImpl and FragmentDataImpl, and its getDataContext(), getDataContextOrNull(), getContainerIds(), and getLoaderIds() methods help inspect the current data setup. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/model/impl/AbstractDataComponentsHolder.html LANGUAGE: java CODE: ```java public abstract class AbstractDataComponentsHolder extends Object implements HasDataComponents // All Implemented Interfaces: HasDataComponents // Direct Known Subclasses: FragmentDataImpl, ViewDataImpl // Fields protected Map<String,InstanceContainer<?>> containers protected DataContext dataContext protected Map<String,DataLoader> loaders // Constructors AbstractDataComponentsHolder() // Methods <T extends InstanceContainer<?>> T getContainer(String id) // Returns a container by its id. Set<String> getContainerIds() // Returns ids of all registered containers. protected Map<String,InstanceContainer<?>> getContainers() DataContext getDataContext() // Returns view's DataContext. DataContext getDataContextOrNull() // Returns view's DataContext or null if it is not defined. <T extends DataLoader> T getLoader(String id) // Returns a loader by its id. Set<String> getLoaderIds() // Returns ids of all registered loaders. protected Map<String,DataLoader> getLoaders() protected abstract String getOwnerId() void loadAll() // Performs DataLoader.load() for all loaders registered in the view. void registerContainer(String id, InstanceContainer<?> container) // Registers the given container void registerLoader(String id, DataLoader loader) // Registers the given loader void setDataContext(DataContext dataContext) // Sets DataContext instance for the view. // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: AbstractDataComponentsHolder holder = new AbstractDataComponentsHolder() { @Override protected String getOwnerId() { return \"customerView\"; } }; holder.setDataContext(dataContext); holder.registerContainer(\"customerDc\", customerContainer); holder.registerLoader(\"customerDl\", customerLoader); holder.loadAll(); InstanceContainer<?> container = holder.getContainer(\"customerDc\"); DataLoader loader = holder.getLoader(\"customerDl\"); ```"
