                      - gridcell:
                        - generic: "TITLE: Interface Action (io.jmix.flowui.kit.action) DESCRIPTION: Action is a reusable command abstraction for Flow UI components. It encapsulates behavior that can be executed with actionPerform(Component) and exposes common presentation properties such as text, description, icon, variant, enabled, visible, and shortcut combination so a visual component can initialize its appearance from the action. Jmix developers use Action when they want to separate UI logic from the component that triggers it, or when they need a shared action instance that can be attached to multiple components and refreshed with refreshState(). SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/kit/action/Action.html LANGUAGE: java CODE: ```java public interface Action extends HasShortcutCombination // All Superinterfaces: HasShortcutCombination // All Known Subinterfaces: ExecutableAction, OperationResultAction, SecuredAction, SecurityConstraintAction, TargetAction<C>, ViewOpeningAction // All Known Implementing Classes: AbstractAction, AbstractCloseTabsAction, AbstractGenericFilterSaveAction, AddAction, AssignToUsersAction, BaseAction, BulkEditAction, ChangePasswordAction, CloseAllTabsAction, CloseOtherTabsAction, CloseThisTabAction, CreateAction, CreateNotificationAction, DateIntervalAction, DaysOfWeekEditAction, DetailCloseAction, DetailDiscardAction, DetailEnableEditingAction, DetailSaveAction, DetailSaveCloseAction, DialogAction, EditAction, EntityClearAction, EntityInspectorAddAction, EntityInspectorCreateAction, EntityInspectorEditAction, EntityInspectorListView.ExportAction, EntityInspectorLookupAction, EntityLookupAction, EntityOpenAction, EntityOpenCompositionAction, ExcelExportAction, ExcludeAction, ExportAction, FragmentAction, GenericFilterAction, GenericFilterAddConditionAction, GenericFilterClearValuesAction, GenericFilterCopyAction, GenericFilterEditAction, GenericFilterMakeDefaultAction, GenericFilterRemoveAction, GenericFilterResetAction, GenericFilterSaveAction, GenericFilterSaveAsAction, GenericFilterSaveWithValuesAction, InputDialogAction, ItemTrackingAction, JsonExportAction, ListDataComponentAction, LogicalFilterEditAction, LogoutAction, LookupDiscardAction, LookupSelectAction, MultiValueSelectAction, ObservableBaseAction, OperationResultViewAction, PickerAction, PreviewStormbpmnDiagramAction, PropertyFilter.OperationChangeAction, ReadAction, RefreshAction, RemoveAction, ReportsMultiValueSelectAction, ResetPasswordAction, RunListEntityReportAction, RunReportAction, RunSingleEntityReportAction, SaveStormbpmnDiagramAction, SecuredBaseAction, SecuredListDataComponentAction, ShowEntityInfoAction, ShowExecutionReportHistoryAction, ShowPivotTableAction, ShowRoleAssignmentsAction, ShowUserSubstitutionsAction, SubstituteUserAction, TabbedModeSubstituteUserAction, TabbedViewsContainerAction, UploadProcessDraftAction, UserMenuAction, UserMenuSubstituteUserAction, UserMenuThemeSwitchAction, ValueClearAction, ViewAction, ViewCloseAction // Fields static final String PROP_DESCRIPTION static final String PROP_ENABLED static final String PROP_ICON static final String PROP_SHORTCUT_COMBINATION static final String PROP_TEXT static final String PROP_VARIANT static final String PROP_VISIBLE // Methods void actionPerform(com.vaadin.flow.component.Component component) // Executes action logic. com.vaadin.flow.shared.Registration addPropertyChangeListener(Consumer<PropertyChangeEvent> listener) // Adds a listener to be notified about changes in the properties of the action. String getDescription() // Returns the description property value of an action. com.vaadin.flow.component.icon.Icon getIcon() // Deprecated, for removal: This API element is subject to removal in a future version. use getIconComponent() instead com.vaadin.flow.component.Component getIconComponent() // Returns the component that represents an icon associated with this action. String getId() String getText() // Returns the text property value of an action. ActionVariant getVariant() // Returns the variant property value of an action. boolean isEnabled() // Returns the enabled property value of an action. boolean isVisible() // Returns the visible property value of an action. void refreshState() // Refreshes internal state of the action to initialize enabled, visible, text, icon, etc. void setDescription(String description) // Sets the description property value of an action. void setEnabled(boolean enabled) // Sets the enabled property value of an action. void setIcon(com.vaadin.flow.component.icon.Icon icon) // Deprecated, for removal: This API element is subject to removal in a future version. use setIconComponent(Component) instead void setIconComponent(com.vaadin.flow.component.Component icon) // Sets the component that represents an icon associated with this action. void setText(String text) // Sets the text property value of an action. void setVariant(ActionVariant variant) // Sets the variant property value of an action. void setVisible(boolean visible) // Sets the visible property value of an action. // Methods inherited from interface io.jmix.flowui.kit.component.HasShortcutCombination: getShortcutCombination, setShortcutCombination // Usage example: import io.jmix.flowui.kit.action.Action; import com.vaadin.flow.component.Component; public class ActionUsage { private final Action action; public ActionUsage(Action action) { this.action = action; this.action.setText(\"Refresh\"); this.action.setDescription(\"Reload data\"); this.action.setVisible(true); this.action.refreshState(); } public void run(Component source) { action.actionPerform(source); } } ```"
