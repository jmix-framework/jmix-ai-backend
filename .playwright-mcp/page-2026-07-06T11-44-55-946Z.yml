                      - gridcell:
                        - generic: "TITLE: Class AbstractBackgroundTaskEvent (io.jmix.flowui.event) DESCRIPTION: Base class for BackgroundTask-related application events in the Jmix Flow UI event model. Use it when you need to react to task lifecycle problems such as timeout or unhandled exception, typically through its subclasses BackgroundTaskTimeoutEvent and BackgroundTaskUnhandledExceptionEvent. The event carries the associated BackgroundTask and a stopPropagation flag that lets a listener control whether further event propagation should continue. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/event/AbstractBackgroundTaskEvent.html LANGUAGE: java CODE: ```java public abstract class AbstractBackgroundTaskEvent extends org.springframework.context.ApplicationEvent // All Implemented Interfaces: Serializable // Direct Known Subclasses: BackgroundTaskTimeoutEvent, BackgroundTaskUnhandledExceptionEvent // See Also: Serialized Form // Constructors AbstractBackgroundTaskEvent(Object source, BackgroundTask<?,?> task) // Methods BackgroundTask<?,?> getTask() // Returns the background task associated with this event. boolean isStopPropagation() // Determines whether the propagation of the event should be stopped. void setStopPropagation(boolean stopPropagation) // Sets whether the propagation of this event should be stopped. // Fields inherited from class java.util.EventObject: source // Methods inherited from class org.springframework.context.ApplicationEvent: getTimestamp // Methods inherited from class java.util.EventObject: getSource, toString // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, wait, wait, wait // Usage example: import io.jmix.flowui.event.AbstractBackgroundTaskEvent; import io.jmix.flowui.backgroundtask.BackgroundTask; public class MyTaskEvent extends AbstractBackgroundTaskEvent { public MyTaskEvent(Object source, BackgroundTask<?, ?> task) { super(source, task); } public void handle() { if (!isStopPropagation()) { setStopPropagation(true); } BackgroundTask<?, ?> task = getTask(); } } ```"
