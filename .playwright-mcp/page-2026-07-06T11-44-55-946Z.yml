                        - generic: 019f373b-ad4e-7206-95a6-e9f4313d4408
                      - gridcell:
                        - generic: "TITLE: Class AbstractComponentGenerationStrategy (io.jmix.flowui.component.factory) DESCRIPTION: Base implementation of a component generation strategy used to create Flow UI components from a component generation context. Jmix developers extend it when they need custom component generation for entity properties, datatypes, enums, files, dates, numbers, booleans, and collections, while reusing shared services such as UiComponents, Metadata, MetadataTools, Actions, DatatypeRegistry, Messages, EntityFieldCreationSupport, and CurrentAuthentication. It also provides helpers for resolving MetaPropertyPath, detecting compositions, setting a value source on SupportsValueSource fields, and configuring zone IDs for date/time components. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/component/factory/AbstractComponentGenerationStrategy.html LANGUAGE: java CODE: ```java public abstract class AbstractComponentGenerationStrategy extends Object implements ComponentGenerationStrategy // All Implemented Interfaces: ComponentGenerationStrategy // Direct Known Subclasses: AppSettingsComponentGenerationStrategy, BulkEditViewComponentGenerationStrategy, CustomDatatypesComponentGenerationStrategy, DefaultComponentGenerationStrategy, InputDialogGenerationStrategy, JpqlFilterComponentGenerationStrategy, MessageTemplateParameterGenerationStrategy, MultiValueSelectDialogGenerationStrategy, PropertyFilterComponentGenerationStrategy, ReportsMultiValueSelectDialogGenerationStrategy, WebdavComponentGenerationStrategy // Fields protected Actions actions protected CurrentAuthentication currentAuthentication protected DatatypeRegistry datatypeRegistry protected EntityFieldCreationSupport entityFieldCreationSupport protected Messages messages protected Metadata metadata protected MetadataTools metadataTools protected UiComponents uiComponents // Constructors AbstractComponentGenerationStrategy(UiComponents uiComponents, Metadata metadata, MetadataTools metadataTools, Actions actions, DatatypeRegistry datatypeRegistry, Messages messages, EntityFieldCreationSupport entityFieldCreationSupport) // Methods protected com.vaadin.flow.component.Component createBooleanField(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createCollectionField(ComponentGenerationContext context, MetaPropertyPath mpp) protected com.vaadin.flow.component.Component createComponentInternal(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createDatatypeField(ComponentGenerationContext context, MetaPropertyPath mpp) protected com.vaadin.flow.component.Component createDatePicker(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createDateTimePicker(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createEntityField(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createEnumField(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createFileStorageUploadField(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createFileUploadField(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createNumberField(ComponentGenerationContext context) protected com.vaadin.flow.component.Component createStringField(ComponentGenerationContext context, MetaPropertyPath mpp) protected com.vaadin.flow.component.Component createTimePicker(ComponentGenerationContext context) protected boolean isComposition(MetaPropertyPath mpp) protected MetaPropertyPath resolveMetaPropertyPath(MetaClass metaClass, String property) void setCurrentAuthentication(CurrentAuthentication currentAuthentication) protected void setupZoneId(HasZoneId component) protected void setValueSource(SupportsValueSource<?> field, ComponentGenerationContext context) // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Methods inherited from interface io.jmix.flowui.component.ComponentGenerationStrategy: createComponent // Usage example: import com.vaadin.flow.component.Component; public class MyGenerationStrategy extends AbstractComponentGenerationStrategy { public MyGenerationStrategy(UiComponents uiComponents, Metadata metadata, MetadataTools metadataTools, Actions actions, DatatypeRegistry datatypeRegistry, Messages messages, EntityFieldCreationSupport entityFieldCreationSupport) { super(uiComponents, metadata, metadataTools, actions, datatypeRegistry, messages, entityFieldCreationSupport); } @Override public Component createComponent(ComponentGenerationContext context) { return createComponentInternal(context); } } ```"
