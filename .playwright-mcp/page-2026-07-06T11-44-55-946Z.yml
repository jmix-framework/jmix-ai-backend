                      - gridcell:
                        - generic: "TITLE: Class AbstractActionBindingImpl<H extends com.vaadin.flow.component.Component,A extends Action,C extends com.vaadin.flow.component.Component> (io.jmix.flowui.action.binder) DESCRIPTION: Base implementation of an ActionBinding that connects a Vaadin Component with a Jmix Action through an ActionBinder. Jmix developers normally encounter this type only indirectly through its subclasses, such as ActionBindingImpl, ActionsHolderBindingImpl, and AbstractShortcutActionBindingImpl, when actions are bound to UI components and later unbound. The class exposes the bound action and component and provides unbind() to remove the registrations created by the binder. It is deprecated for removal, so new code should avoid depending on it directly. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/action/binder/AbstractActionBindingImpl.html LANGUAGE: java CODE: ```java @Deprecated(since=\"2.2\", forRemoval=true) public abstract class AbstractActionBindingImpl<H extends com.vaadin.flow.component.Component,A extends Action,C extends com.vaadin.flow.component.Component> extends Object implements ActionBinding<C,A> // All Implemented Interfaces: ActionBinding<C,A> // Direct Known Subclasses: AbstractShortcutActionBindingImpl, ActionBindingImpl, ActionsHolderBindingImpl // Fields protected final A action // Deprecated, for removal: This API element is subject to removal in a future version. protected ActionBinder<H> binder // Deprecated, for removal: This API element is subject to removal in a future version. protected final C component // Deprecated, for removal: This API element is subject to removal in a future version. protected List<com.vaadin.flow.shared.Registration> registrations // Deprecated, for removal: This API element is subject to removal in a future version. // Constructors AbstractActionBindingImpl(ActionBinder<H> binder, A action, C component, List<com.vaadin.flow.shared.Registration> registrations) // Deprecated, for removal: This API element is subject to removal in a future version. // Methods A getAction() // Deprecated, for removal: This API element is subject to removal in a future version. C getComponent() // Deprecated, for removal: This API element is subject to removal in a future version. void unbind() // Deprecated, for removal: This API element is subject to removal in a future version. // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: ActionBinder<com.vaadin.flow.component.Component> binder = null; Action action = null; com.vaadin.flow.component.Component component = null; java.util.List<com.vaadin.flow.shared.Registration> registrations = new java.util.ArrayList<>(); AbstractActionBindingImpl<com.vaadin.flow.component.Component, Action, com.vaadin.flow.component.Component> binding = new AbstractActionBindingImpl<>(binder, action, component, registrations) {}; binding.getAction(); binding.getComponent(); binding.unbind(); ```"
