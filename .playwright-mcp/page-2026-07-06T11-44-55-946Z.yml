                      - gridcell:
                        - generic: "TITLE: Class AbstractAggregation<T> (io.jmix.flowui.data.aggregation.impl) DESCRIPTION: AbstractAggregation<T> is a base implementation of the Aggregation interface for computing aggregated values from a collection of items. Use it when you need common aggregation behavior such as count, sum, min, max, or avg and want a reusable superclass for specialized implementations like AbstractNumberAggregation, CountAggregation, or DateTimeAggregation. The class stores the result type in clazz and exposes getResultClass() plus getSupportedAggregationTypes() to describe which AggregationInfo.Type values are available for the конкретный aggregation. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/data/aggregation/impl/AbstractAggregation.html LANGUAGE: java CODE: ```java public abstract class AbstractAggregation<T> extends Object implements Aggregation<T> // Type Parameters: T - the type of the items being aggregated // All Implemented Interfaces: Aggregation<T> // Direct Known Subclasses: AbstractNumberAggregation, CountAggregation, DateTimeAggregation // Fields protected Class<T> clazz // Constructors AbstractAggregation(Class<T> clazz) // Methods T avg(Collection<T> items) // Computes the average value of the elements in the provided collection. int count(Collection<T> items) // Counts the number of elements in the provided collection. Class<T> getResultClass() // Returns the class type of the result produced by this aggregation. EnumSet<AggregationInfo.Type> getSupportedAggregationTypes() // Returns the set of aggregation types that are supported by this class. T max(Collection<T> items) // Determines the maximum value in the provided collection of items. T min(Collection<T> items) // Determines the minimum value in the provided collection of items. T sum(Collection<T> items) // Calculates the sum of the provided collection of items. // Methods inherited from class java.lang.Object: clone, equals, finalize, getClass, hashCode, notify, notifyAll, toString, wait, wait, wait // Usage example: import java.util.Collection; public class MyNumberAggregation extends AbstractAggregation<Double> { public MyNumberAggregation() { super(Double.class); } public Double calculateTotal(Collection<Double> items) { return sum(items); } public int calculateCount(Collection<Double> items) { return count(items); } } ```"
