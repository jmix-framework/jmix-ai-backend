                      - gridcell:
                        - generic: "TITLE: Interface Aggregation<T> (io.jmix.flowui.data.aggregation) DESCRIPTION: Represents an aggregation strategy for a collection of items in Jmix Flow UI data aggregation. Use this interface when you need to calculate common summary values such as sum, average, minimum, maximum, or count for a collection, and when you want to know which aggregation types are supported by a particular implementation. Implementations include number and date/time aggregations such as CountAggregation, BigDecimalAggregation, DateAggregation, LocalDateAggregation, and others, all of which return their result type via getResultClass() and advertise supported operations with getSupportedAggregationTypes(). SOURCE: https://docs.jmix.io/api/2.8/io/jmix/flowui/data/aggregation/Aggregation.html LANGUAGE: java CODE: ```java public interface Aggregation<T> // Type Parameters: T - the type of the items to be aggregated // All Known Implementing Classes: AbstractAggregation, AbstractNumberAggregation, BigDecimalAggregation, BigIntegerAggregation, CountAggregation, DateAggregation, DateTimeAggregation, DoubleAggregation, LocalDateAggregation, LocalDateTimeAggregation, LocalTimeAggregation, LongAggregation, OffsetDateTimeAggregation, OffsetTimeAggregation, TimeAggregation // Methods T avg(Collection<T> items) // Computes the average value of the elements in the provided collection. int count(Collection<T> items) // Counts the number of elements in the provided collection. Class<T> getResultClass() // Returns the class type of the result produced by this aggregation. EnumSet<AggregationInfo.Type> getSupportedAggregationTypes() // Returns the set of aggregation types that are supported by this class. T max(Collection<T> items) // Determines the maximum value in the provided collection of items. T min(Collection<T> items) // Determines the minimum value in the provided collection of items. T sum(Collection<T> items) // Calculates the sum of the provided collection of items. // Usage example: import java.util.Collection; Aggregation<Integer> aggregation = null; Collection<Integer> items = null; int totalCount = aggregation.count(items); Integer totalSum = aggregation.sum(items); Integer minValue = aggregation.min(items); Integer maxValue = aggregation.max(items); ```"
                      - gridcell:
