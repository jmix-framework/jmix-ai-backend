                      - gridcell:
                        - generic: "TITLE: Interface UserRepository (io.jmix.core.security) DESCRIPTION: A UserRepository is the Jmix-specific extension of Spring Security's UserDetailsService used to load application users and access built-in accounts. Jmix developers use it when they need the standard loadUserByUsername flow plus repository operations such as getSystemUser() and getAnonymousUser() for framework-level authentication and security checks. It also provides getByUsernameLike(String), which is useful for searching users by partial username in database, LDAP, REST, or composite user repository implementations. SOURCE: https://docs.jmix.io/api/2.8/io/jmix/core/security/UserRepository.html LANGUAGE: java CODE: ```java public interface UserRepository extends org.springframework.security.core.userdetails.UserDetailsService // All Superinterfaces: org.springframework.security.core.userdetails.UserDetailsService // All Known Implementing Classes: AbstractDatabaseUserRepository, AbstractRestUserRepository, CompositeUserRepository, DatabaseUserRepository, InMemoryUserRepository, LdapUserRepository // Methods org.springframework.security.core.userdetails.UserDetails getAnonymousUser() // Returns the built-in 'anonymous' user. List<? extends org.springframework.security.core.userdetails.UserDetails> getByUsernameLike(String substring) // Returns the list of users whose username contains the given substring. org.springframework.security.core.userdetails.UserDetails getSystemUser() // Returns the built-in 'system' user. // Methods inherited from interface org.springframework.security.core.userdetails.UserDetailsService: loadUserByUsername // Usage example: UserRepository userRepository = null; org.springframework.security.core.userdetails.UserDetails systemUser = userRepository.getSystemUser(); org.springframework.security.core.userdetails.UserDetails anonymousUser = userRepository.getAnonymousUser(); org.springframework.security.core.userdetails.UserDetails admin = userRepository.loadUserByUsername(\"admin\"); java.util.List<? extends org.springframework.security.core.userdetails.UserDetails> matches = userRepository.getByUsernameLike(\"john\"); ```"
