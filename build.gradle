plugins {
    id 'io.jmix' version '3.0.3'
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'com.vaadin'

jmix {
    bomVersion = '3.0.3'
}

group = 'io.jmix.ai'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://global.repo.jmix.io/repository/public'
    }
}

dependencies {
    // Spring AI modules below have no versions: they come from this BOM. The Jmix BOM manages Spring AI 2.0.0; the chat
    // needs 2.1 for OpenAiResponsesChatModel: OpenAI runs tool calls with reasoning only through the Responses API.
    implementation platform('org.springframework.ai:spring-ai-bom:2.1.0-RC2')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-pgvector-store'
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'

    implementation 'io.projectreactor:reactor-core'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-opentelemetry'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.28.1-alpha'

    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.jsoup:jsoup'
    implementation 'org.asciidoctor:asciidoctorj:3.0.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    // Jmix 3.0.x security starters do not bring spring-boot-security. Without it Spring Boot 4 does not register the
    // security filter chain first and for all dispatcher types (jmix-framework/jmix#5886, fixed in Jmix 3.1.0).
    // Remove this line when the project moves to Jmix 3.1.0 or later.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jmix.security:jmix-security-starter'
    implementation 'io.jmix.security:jmix-security-flowui-starter'
    implementation 'io.jmix.security:jmix-security-data-starter'
    implementation 'io.jmix.localfs:jmix-localfs-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-data-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'
    implementation 'io.jmix.datatools:jmix-datatools-starter'
    implementation 'io.jmix.datatools:jmix-datatools-flowui-starter'
    implementation 'io.jmix.gridexport:jmix-gridexport-flowui-starter'
    implementation 'io.jmix.charts:jmix-charts-flowui-starter'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.vaadin:vaadin-dev'

    implementation 'org.postgresql:postgresql'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.jmix.flowui:jmix-flowui-test-assist'
    testImplementation 'org.hsqldb:hsqldb'
}

// Spring AI 2.1.0-RC2 is built on Spring Boot 4.2.0-RC2, while the Jmix BOM manages Spring Boot 4.0.8. Gradle takes
// the highest requested version, so without this rule Spring AI pulls Spring Boot 4.2.0-RC2 modules, Spring Framework
// 7.1.0-RC2, Micrometer 1.18, Reactor 3.9 and Kotlin 2.4 into an application that otherwise runs on Spring Boot 4.0.8.
//
// The rule turns the versions Spring AI modules declare for the groups below from "required" into "preferred".
// A preference loses to any requirement, so the Jmix BOM versions win and the whole application runs on one
// Spring Boot version. Spring AI 2.1 is built on Spring Boot 4.2, so running it on 4.0.8 relies on this project's
// tests and live checks.
//
// List only groups the Jmix BOM manages: for any other library a preference would also lose to an older version
// requested by a third library.
// Remove the rule when every org.springframework.boot module resolves to the Jmix BOM version without it.
def jmixManagedGroups = ['org.springframework', 'org.springframework.boot', 'io.micrometer', 'io.projectreactor',
                         'com.zaxxer', 'org.jetbrains.kotlin', 'tools.jackson.core']

dependencies {
    components {
        all { details ->
            if (details.id.group == 'org.springframework.ai') {
                details.allVariants {
                    withDependencies { deps ->
                        deps.findAll { it.group in jmixManagedGroups }
                                .each { dep ->
                                    String version = dep.versionConstraint.requiredVersion
                                    dep.version { require ''; prefer version }
                                }
                    }
                }
            }
        }
    }
}

configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
    exclude group: 'com.vaadin', module: 'copilot'
}

test {
    useJUnitPlatform()
}

idea {
    module {
        excludeDirs.addAll(files '.jmix', 'node_modules', 'src/main/frontend/generated/', 'src/main/bundles')
    }
}

vaadin {
    optimizeBundle = false
}

tasks.named("bootBuildImage") {
    imageName = "jmix-ai-backend"
    environment["BPE_APPEND_JAVA_TOOL_OPTIONS"] = " -Dspring.profiles.active=prod"
}